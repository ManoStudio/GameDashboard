<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Game Build Dashboard</title>
    <style>
        :root {
            --ink: #16211f;
            --muted: #5d6d66;
            --line: #dce5df;
            --panel: #ffffff;
            --page: #f4f7f2;
            --lime: #b7ff5a;
            --rose: #ca3f64;
            --charcoal: #1f2a27;
            --shadow: 0 16px 40px rgba(31, 42, 39, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--page);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 18px;
        }

        .panel {
            width: min(420px, 100%);
            display: grid;
            gap: 18px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mark {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: var(--lime);
            color: var(--charcoal);
            font-weight: 800;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            line-height: 1.1;
        }

        .meta,
        .label {
            color: var(--muted);
        }

        .form-grid,
        .field {
            display: grid;
            gap: 10px;
        }

        .label {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fbfdf9;
            color: var(--ink);
            padding: 10px 12px;
            font: inherit;
        }

        button {
            min-height: 42px;
            border: 0;
            border-radius: 8px;
            background: var(--charcoal);
            color: #fff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        button[disabled] {
            cursor: wait;
            opacity: 0.72;
        }

        .alert {
            border: 1px solid #efb2c1;
            background: #fff0f4;
            color: var(--rose);
            border-radius: 8px;
            padding: 12px;
        }

        .soft-load {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 50;
            width: min(360px, calc(100vw - 36px));
            display: none;
            grid-template-columns: 34px minmax(0, 1fr);
            gap: 12px;
            align-items: center;
            background: rgba(31, 42, 39, 0.96);
            color: #f8fff9;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 14px;
        }

        .soft-load.active {
            display: grid;
        }

        .soft-load strong {
            display: block;
            line-height: 1.2;
        }

        .soft-load span {
            color: #b9cbc2;
            font-size: 13px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.24);
            border-top-color: var(--lime);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <style>
        :root {
            color-scheme: dark;
            --page: #0b1016;
            --panel: #151f2a;
            --field: #101821;
            --ink: #f2f6fb;
            --muted: #8ea1b5;
            --line: #2a3b4c;
            --cyan: #54d9ff;
            --cyan-soft: rgba(84, 217, 255, 0.12);
            --rose: #f27686;
            --rose-soft: rgba(242, 118, 134, 0.12);
            --shadow: 0 22px 60px rgba(0, 0, 0, 0.22);
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --page: #f4f7fa;
            --panel: #ffffff;
            --field: #ffffff;
            --ink: #17212b;
            --muted: #6c7d8f;
            --line: #d7e1ea;
            --cyan: #079dce;
            --cyan-soft: rgba(7, 157, 206, 0.11);
            --rose: #d64f63;
            --rose-soft: rgba(214, 79, 99, 0.1);
            --shadow: 0 16px 38px rgba(34, 53, 72, 0.08);
        }

        html,
        body {
            background: var(--page);
            color: var(--ink);
        }

        body {
            position: relative;
            padding: 24px;
        }

        .panel {
            position: relative;
            width: min(440px, 100%);
            border-radius: 18px;
            border-color: var(--line);
            background: var(--panel);
            box-shadow: var(--shadow);
            padding: 28px;
        }

        .mark {
            border-radius: 13px;
            background: var(--cyan);
            color: #07151c;
            box-shadow: none;
        }

        h1 {
            color: var(--ink);
            letter-spacing: -0.03em;
        }

        .meta,
        .label {
            color: var(--muted);
        }

        .label {
            letter-spacing: 0.08em;
        }

        input {
            min-height: 46px;
            border-radius: 10px;
            border-color: var(--line);
            background: var(--field);
            color: var(--ink);
            outline: none;
            transition: border-color 140ms ease, box-shadow 140ms ease;
        }

        input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px var(--cyan-soft);
        }

        button {
            min-height: 46px;
            border-radius: 11px;
            background: var(--cyan);
            color: #07151c;
            transition: transform 140ms ease, filter 140ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .theme-toggle {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 38px;
            min-height: 38px;
            padding: 0;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
        }

        .alert {
            border-color: rgba(242, 118, 134, 0.35);
            border-radius: 11px;
            background: var(--rose-soft);
            color: var(--rose);
        }

        .soft-load {
            border-radius: 14px;
            border-color: var(--line);
            background: var(--panel);
            color: var(--ink);
            box-shadow: var(--shadow);
        }

        .soft-load span {
            color: var(--muted);
        }

        .spinner {
            border-color: var(--line);
            border-top-color: var(--cyan);
        }
    </style>
</head>

<body>
    <main class="panel">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme"
            title="Switch theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                aria-hidden="true">
                <circle cx="12" cy="12" r="3.5"></circle>
                <path d="M12 2.5v2M12 19.5v2M4.1 4.1l1.4 1.4M18.5 18.5l1.4 1.4M2.5 12h2M19.5 12h2M4.1 19.9l1.4-1.4M18.5 5.5l1.4-1.4"></path>
            </svg>
        </button>
        <div class="brand">
            <div class="mark">BP</div>
            <div>
                <h1>Build Producer</h1>
                <div class="meta">Dashboard login</div>
            </div>
        </div>

        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}

        {% if firebase_error %}
        <div class="alert">Firebase is not configured, so only demo/admin env users can sign in.</div>
        {% endif %}

        <form class="form-grid" method="post" data-loading-steps="Checking credentials|Creating session|Opening dashboard">
            <label class="field">
                <span class="label">Email</span>
                <input name="email" type="email" autocomplete="email" required autofocus>
            </label>
            <label class="field">
                <span class="label">Password</span>
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Login</button>
        </form>
    </main>

    <div class="soft-load" id="softLoad" role="status" aria-live="polite" aria-hidden="true">
        <div class="spinner" aria-hidden="true"></div>
        <div>
            <strong id="softLoadTitle">Working</strong>
            <span id="softLoadStep">Please wait</span>
        </div>
    </div>

    <script>
        const softLoad = document.getElementById("softLoad");
        const softLoadTitle = document.getElementById("softLoadTitle");
        const softLoadStep = document.getElementById("softLoadStep");
        let softLoadTimer = null;

        function showSoftLoad(steps, source) {
            const safeSteps = steps.filter(Boolean);
            clearInterval(softLoadTimer);
            let index = 0;
            softLoadTitle.textContent = safeSteps[0] || "Working";
            softLoadStep.textContent = safeSteps[1] || "Waiting for the server to finish";
            softLoad.classList.add("active");
            softLoad.setAttribute("aria-hidden", "false");

            source.querySelectorAll("button").forEach((button) => {
                button.disabled = true;
                button.textContent = "Working...";
            });

            softLoadTimer = setInterval(() => {
                index = (index + 1) % safeSteps.length;
                softLoadTitle.textContent = safeSteps[index];
                softLoadStep.textContent = "Waiting for the request to complete";
            }, 1400);
        }

        document.querySelectorAll("form[data-loading-steps]").forEach((form) => {
            form.addEventListener("submit", () => {
                showSoftLoad(form.dataset.loadingSteps.split("|"), form);
            });
        });
    </script>
    <script>
        const themeStorageKey = "game-build-dashboard-theme";
        const savedTheme = window.localStorage.getItem(themeStorageKey);

        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            window.localStorage.setItem(themeStorageKey, theme);
            document.querySelectorAll("[data-theme-toggle]").forEach((button) => {
                const nextTheme = theme === "dark" ? "light" : "dark";
                button.setAttribute("aria-label", `Switch to ${nextTheme} theme`);
                button.setAttribute("title", `Switch to ${nextTheme} theme`);
            });
        }

        applyTheme(savedTheme === "light" ? "light" : "dark");
        document.querySelectorAll("[data-theme-toggle]").forEach((button) => {
            button.addEventListener("click", () => {
                const currentTheme = document.documentElement.dataset.theme || "dark";
                applyTheme(currentTheme === "dark" ? "light" : "dark");
            });
        });
    </script>
</body>

</html>
